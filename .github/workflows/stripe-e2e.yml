name: Mocked Stripe E2E

on:
  pull_request:
    paths:
      - apps/platform/**
      - apps/voice-agent/**
      - packages/contracts/**
      - packages/database/**
      - supabase/migrations/**
      - scripts/e2e/**
      - scripts/test-stripe-e2e.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - turbo.json
      - .github/workflows/stripe-e2e.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripe-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mocked-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Prepare the pinned runner before network isolation
        run: corepack prepare pnpm@10.16.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system libraries
        run: pnpm --filter @agentcaller/platform exec playwright install --with-deps chromium
      - name: Generate documentation types
        run: pnpm --filter @agentcaller/docs exec fumadocs-mdx
      - name: Check contracts and application types
        run: pnpm --filter @agentcaller/contracts test && pnpm typecheck
      - name: Check the E2E result gate
        run: node --test scripts/e2e/*.test.mjs
      - name: Run mocked browser, worker and accounting journey
        run: pnpm test:stripe-e2e
      # Raw browser diagnostics can contain setup links and cookies; do not upload them.
